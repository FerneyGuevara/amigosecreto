<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo secreto</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef5ef;--card:#fff;--ink:#14301f;--mute:#5b7566;--line:#cfe0d3;--accent:#c2185b;--accent-ink:#fff;--gold:#f0bd3b;--chip:#dcebdf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1f16;--card:#172a1f;--ink:#e8f3ea;--mute:#98b3a1;--line:#2a4535;--accent:#ff5c9a;--accent-ink:#2a0615;--gold:#f0bd3b;--chip:#1f3829}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1f16;--card:#172a1f;--ink:#e8f3ea;--mute:#98b3a1;--line:#2a4535;--accent:#ff5c9a;--accent-ink:#2a0615;--gold:#f0bd3b;--chip:#1f3829}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 clamp(34px,9vw,52px)/1 "Bricolage Grotesque",Georgia,serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{font:700 18px/1.3 "Bricolage Grotesque",Georgia,serif;margin:0 0 10px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:700 16px "DM Sans",sans-serif;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 8px 6px 14px;font-weight:500}
.chip button{background:none;color:var(--mute);padding:0 6px;font-size:18px;line-height:1}
.pick{background:var(--chip);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:500}
.pick.on{background:var(--ink);color:var(--bg)}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:800 30px/1 "Bricolage Grotesque",Georgia,serif}
.stat span{color:var(--mute);font-size:14px}
.tag{position:relative;background:var(--gold);color:#2b2108;border-radius:6px 22px 22px 6px;padding:34px 26px 30px 56px;margin:6px 0 16px;text-align:left;animation:unwrap .55s cubic-bezier(.2,.9,.3,1.2)}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.tag small{display:block;font-weight:500;opacity:.8}
.tag strong{display:block;font:800 clamp(34px,10vw,54px)/1.05 "Bricolage Grotesque",Georgia,serif;overflow-wrap:anywhere}
@keyframes unwrap{from{transform:rotate(-6deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tag{animation:none}}
.warn{color:var(--mute);font-size:14px;margin:0 0 12px}
.err{color:var(--accent);font-weight:500;margin:8px 0 0}
.foot{text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Amigo secreto</h1>
<p class="sub">Cada persona saca un nombre al azar. Quien sale elegido deja de estar disponible.</p>
<div id="app"></div>
</main>
<script>
var KEY="amigo-secreto-v1";
var S={phase:"setup",names:[],hints:{},pending:[],pool:[],giver:null,reveal:null,err:""};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.phase)S=o;if(!S.hints)S.hints={};S.err=""}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function addName(){
  var el=document.getElementById("n"),v=el.value.trim();
  if(!v)return;
  if(S.names.some(function(n){return n.toLowerCase()===v.toLowerCase()})){S.err="Ese nombre ya está en la lista.";render();return}
  S.names.push(v);var hv=document.getElementById("h").value.trim();if(hv)S.hints[v]=hv;S.err="";save();render();document.getElementById("n").focus();
}
function removeName(i){delete S.hints[S.names[i]];S.names.splice(i,1);S.err="";save();render()}
function start(){S.phase="draw";S.pending=S.names.slice();S.pool=S.names.slice();S.giver=null;S.reveal=null;S.err="";save();render()}
function choose(i){S.giver=S.pending[i];S.err="";save();render()}
function draw(){
  var g=S.giver;if(!g)return;
  var rest=S.pending.filter(function(n){return n!==g});
  var cand=S.pool.filter(function(p){
    if(p===g)return false;
    var rp=S.pool.filter(function(x){return x!==p});
    return !(rest.length===1&&rp.length===1&&rest[0]===rp[0]);
  });
  if(!cand.length){S.err="No hay opciones válidas. Reinicia el sorteo.";render();return}
  var t=cand[Math.floor(Math.random()*cand.length)];
  S.pool=S.pool.filter(function(x){return x!==t});
  S.pending=rest;S.reveal={giver:g,target:t};S.giver=null;S.err="";save();render();
}
function hide(){S.reveal=null;if(!S.pending.length)S.phase="done";save();render()}
function reset(){if(!confirm("¿Reiniciar todo? Se pierden las asignaciones."))return;S={phase:"setup",names:S.names,hints:S.hints,pending:[],pool:[],giver:null,reveal:null,err:""};save();render()}
function render(){
  var h="";
  if(S.phase==="setup"){
    h+='<div class="card"><h2>Participantes</h2><div class="row"><input id="n" placeholder="Escribe un nombre" autocomplete="off"><button id="add">Agregar</button></div><div class="row" style="margin-top:8px"><input id="h" placeholder="Pista opcional (ej. le gusta el café)" autocomplete="off"></div>';
    if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
    h+='<div class="chips">'+S.names.map(function(n,i){return '<span class="chip">'+esc(n)+(S.hints[n]?' <small style="color:var(--mute)">(pista: '+esc(S.hints[n])+')</small>':'')+'<button data-rm="'+i+'" aria-label="Quitar '+esc(n)+'">×</button></span>'}).join("")+'</div></div>';
    h+='<button id="go"'+(S.names.length<3?" disabled":"")+'>Empezar sorteo</button>';
    if(S.names.length<3)h+='<p class="warn" style="margin-top:10px">Agrega al menos 3 personas para empezar.</p>';
  }else{
    h+='<div class="stats"><div class="stat"><b>'+S.pending.length+'</b><span>por sacar</span></div><div class="stat"><b>'+S.pool.length+'</b><span>disponibles</span></div></div>';
    if(S.reveal){
      h+='<div class="card"><h2>'+esc(S.reveal.giver)+', tu amigo secreto es:</h2><div class="tag"><small>Para quien compras</small><strong>'+esc(S.reveal.target)+'</strong>'+(S.hints[S.reveal.target]?'<small style="margin-top:10px">Pista: '+esc(S.hints[S.reveal.target])+'</small>':'')+'</div><p class="warn">Memoriza el nombre y toca el botón antes de pasar el celular. Este nombre ya salió de la lista.</p><button id="hide">Listo, ocultar nombre</button></div>';
    }else if(S.phase==="done"){
      h+='<div class="card"><h2>Sorteo completo</h2><p>Todos ya tienen su amigo secreto. Guarden el secreto.</p></div>';
    }else{
      h+='<div class="card"><h2>¿Quién eres?</h2><div class="chips" style="margin-top:0">'+S.pending.map(function(n,i){return '<button class="pick'+(n===S.giver?" on":"")+'" data-pick="'+i+'">'+esc(n)+'</button>'}).join("")+'</div></div>';
      h+='<button id="draw"'+(S.giver?"":" disabled")+'>Sacar mi amigo secreto</button>';
      if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
    }
    h+='<div class="foot"><button class="ghost" id="reset">Reiniciar sorteo</button></div>';
  }
  document.getElementById("app").innerHTML=h;
  var q=function(i){return document.getElementById(i)};
  if(q("add")){q("add").onclick=addName;q("n").onkeydown=q("h").onkeydown=function(e){if(e.key==="Enter")addName()}}
  if(q("go"))q("go").onclick=start;
  if(q("draw"))q("draw").onclick=draw;
  if(q("hide"))q("hide").onclick=hide;
  if(q("reset"))q("reset").onclick=reset;
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){removeName(+b.dataset.rm)}});
  document.querySelectorAll("[data-pick]").forEach(function(b){b.onclick=function(){choose(+b.dataset.pick)}});
}
load();render();
</script>
</body>
</html>
